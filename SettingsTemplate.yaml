body:
  - type: dropdown
    attributes:
      name: default_browser
      label: Browser Selection
      defaultValue: All Browsers
      description: Select 'All Browsers' to search every supported browser, a specific browser, or a 'Custom Profile'.
      options:
        - All Browsers
        - Arc
        - Brave
        - Brave Nightly
        - Chrome
        - Custom Profile
        - Edge
        - Firefox
        - Floorp
        - Helium
        - Opera
        - Thorium
        - Vivaldi
        - Waterfox
        - Zen
  - type: dropdown
    attributes:
      name: profile_search_mode
      label: Profile Search Mode
      defaultValue: Active Profile
      description: Choose how the plugin handles multiple profiles within a browser.
      options:
        - Active Profile
        - All Profiles
  - type: textarea
    attributes:
      name: custom_profile_path
      label: Custom Profile Directories
      defaultValue: ""
      description: Comma-separated list of custom profile paths. Required only if "Custom Profile" is selected, or if you want to include custom profiles with "All Browsers".
  - type: input
    attributes:
      name: history_limit
      label: History Limit
      defaultValue: "1000"
      description: Maximum number of recent history entries to retrieve per browser profile.
  - type: input
    attributes:
      name: max_ui_results
      label: UI Results Limit
      defaultValue: "500"
      description: Maximum number of final results to display in Flow Launcher.
  - type: dropdown
    attributes:
      name: date_display
      label: Date Display
      defaultValue: Absolute
      description: Show when a page was last visited as a fixed date, or as an age ("Yesterday at 19:43").
      options:
        - Absolute
        - Relative
  - type: dropdown
    attributes:
      name: time_format
      label: Time Format
      defaultValue: 12-hour
      description: The clock used for times in results. 'System' follows your Windows regional settings.
      options:
        - 12-hour
        - 24-hour
        - System
  - type: dropdown
    attributes:
      name: url_display
      label: URL Display
      defaultValue: Full URL
      description: Show the full address of each result. Or just the domain (e.g. github.com), or domain and the path (e.g. github.com/fahim-ahmed05/browser-history-v2).
      options:
        - Full URL
        - Domain only
        - Domain and path
  - type: dropdown
    attributes:
      name: subtitle_layout
      label: Subtitle Layout
      defaultValue: Bracketed
      description: How the date and address are separated underneath each result.
      options:
        - Bracketed
        - Dashed
  - type: checkbox
    attributes:
      name: show_favicons
      label: Show Favicons
      defaultValue: False
      description: Show each site's icon, taken from your browser's own icon cache (no requests are made). The first search reads the icons; later ones reuse the cache.
  - type: textarea
    attributes:
      name: blocked_domains
      label: Blocked Domains
      defaultValue: ""
      description: Comma-separated list of domains to hide from search results (e.g., facebook.com, twitter.com).
  - type: checkbox
    attributes:
      name: keep_history_cache
      label: Keep History Cache
      defaultValue: False
      description: Keeps separate browser caches for each computer to speed up searches and reduce cloud sync usage when switching computers.
